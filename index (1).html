<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қазақстан тарихы — 500 сұрақ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ff;--card:#fff;--tx:#241b3d;--mu:#6f6890;--pr:#7c3aed;--pr2:#ede7ff;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bd:#e2dcf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#1f1a3a;--tx:#f0ecff;--mu:#a49ec7;--pr:#a78bfa;--pr2:#2c2450;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1818;--bd:#352d5c}}
:root[data-theme="dark"]{--bg:#15112a;--card:#1f1a3a;--tx:#f0ecff;--mu:#a49ec7;--pr:#a78bfa;--pr2:#2c2450;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1818;--bd:#352d5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:21px;margin:0 0 12px}
.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.15s}
.card:hover{border-color:var(--pr);transform:translateY(-2px)}
.card b{font-size:22px;display:block}
.bar{height:8px;background:var(--pr2);border-radius:8px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--pr2);color:var(--pr)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.q p{margin:0 0 10px;font-weight:600}
.o{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);color:inherit;font:inherit;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
.o span:first-child{font-weight:700;color:var(--pr);min-width:1.2em}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.pb{height:10px;background:var(--pr2);border-radius:10px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:var(--pr);transition:.3s}
label{cursor:pointer;user-select:none}
.code{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:0 0 10px;overflow-x:auto;white-space:pre;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.cl li{margin:0 0 8px}.cl .sub{display:block;color:var(--mu);font-size:14px}
.big{font-size:56px;font-weight:800;color:var(--pr);margin:6px 0}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[{"n":1,"q":"Адамзат тарихының ең ежелгі кезеңі қайсы?","o":["Палеолит","Неолит","Энеолит","Қола дәуірі","Темір дәуірі"]},{"n":2,"q":"Қазақстандағы палеолит дәуірінің ежелгі тас құралдарымен белгілі археологиялық ескерткіш қайсы?","o":["Бөріқазған","Бесшатыр","Есік","Берел","Отырар"]},{"n":3,"q":"Ботай қонысы Қазақстан тарихының қай кезеңіне жатады?","o":["Энеолит","Палеолит","Орта ғасырлар","Неолит","Мезолит"]},{"n":4,"q":"Қазақстандағы қай мәдениет қола дәуіріне жатады?","o":["Андрон мәдениеті","Ботай мәдениеті","Сақ мәдениеті","Үйсін мәдениеті","Қаңлы мәдениеті"]},{"n":5,"q":"Ежелгі органикалық қалдықтардың жасын анықтау үшін қандай әдіс қолданылады?","o":["Радиокөміртектік талдау","Лингвистикалық талдау","Радиоизотоптық талдау","Калий-аргон әдісі","Палеомагниттік талдау"]},{"n":6,"q":"Қола дәуірінде адамдардың шаруашылық өмірінде қандай маңызды өзгеріс болды?","o":["Металл еңбек құралдарын өндіру дамып, бақташылық мал шаруашылығы пайда болды","Көшпелі мал шаруашылығы қалыптасып, темірді жаппай игеру басталды","Шақпақтас пен тас еңбек құралдарын пайдалану тоқтады","Жетісуда отырықшы егіншілердің алғашқы қалалық қоныстары пайда болды","Классикалық үлгідегі алғашқы еңбек бөлінісі пайда болды"]},{"n":7,"q":"Қола жасау үшін қандай металдар пайдаланылды?","o":["Мыс пен қалайы","Мыс пен күміс","Алтын мен қорғасын","Күміс пен қалайы","Темір мен мырыш"]},{"n":8,"q":"Шілікті сақ обалары қай кезеңге жатады?","o":["Б.з.б. VIII–VII ғасырлар","Б.з.б. VII–VII ғасырлар","Б.з.б. IX–VIII ғасырлар","Б.з.б. V–IV ғасырлар","Б.з.б. VI–V ғасырлар"]},{"n":9,"q":"Шығыс Қазақстан облысының Зайсан ауданында қандай обалар орналасқан?","o":["Шілікті обалары","Есік обалары","Берел обалары","Боралдай обалары","Жетітөбе обалары"]},{"n":10,"q":"Ерте темір дәуірінде Қазақстан аумағының едәуір бөлігін мекендеген ежелгі тайпалар қалай аталды?","o":["Сақтар","Қаңлылар","Үйсіндер","Ғұндар","Түркілер"]},{"n":11,"q":"1969 жылы сақ дәуірінің «Алтын адамы» табылуымен әйгілі болған Қазақстанның археологиялық ескерткіші қайсы?","o":["Есік обасы","Бесшатыр обасы","Берел обасы","Ботай қонысы","Аралтөбе обасы"]},{"n":12,"q":"Жетісудағы ірі сақ обаларымен белгілі ерте темір дәуірінің ескерткіші қайсы?","o":["Бесшатыр","Ботай","Шілікті","Берел","Бәйгетөбе"]},{"n":13,"q":"Шілікті обалар кешені Қазақстанның қай өңірінде орналасқан?","o":["Шығыс Қазақстанда","Батыс Қазақстанда","Оңтүстік Қазақстанда","Солтүстік Қазақстанда","Орталық Қазақстанда"]},{"n":14,"q":"Сақтар және ежелгі дәуірдің басқа халықтары туралы мәлімет қалдырған ежелгі грек тарихшысы кім?","o":["Геродот","Платон","Аристотель","Сократ","Фукидид"]},{"n":15,"q":"Орталық Азияда қуатты саяси мемлекет құрған ежелгі тайпалық бірлестік қайсы?","o":["Ғұндар","Қаңлылар","Сарматтар","Ежелгі гректер","Үйсіндер"]},{"n":16,"q":"Үйсіндердің тарихы Қазақстанның қай өңірімен тығыз байланысты?","o":["Жетісу","Маңғыстау","Каспий маңы ойпаты","Солтүстік Арал маңы","Торғай үстірті"]},{"n":17,"q":"Ежелгі Қаңлы мемлекеті қай өзеннің алабында орналасқан?","o":["Сырдария","Ертіс","Жайық","Еділ","Әмудария"]},{"n":18,"q":"Қаңлылардың Жетіасар мәдениеті негізінен қай аумақта таралған?","o":["Қуаңдария мен Жаңадария аңғарларында","Отырар шұратында","Сырдарияның орта ағысында","Ертіс бойында","Жайық пен Еділ аралығында"]},{"n":19,"q":"Иемденуші шаруашылыққа қандай қызмет түрлері жатады?","o":["Аңшылық пен терімшілік","Егіншілік пен терімшілік","Дәнді дақылдар өсіру мен терімшілік","Аңшылық пен үй жануарларын өсіру","Қолөнер бұйымдарын өндіру"]},{"n":20,"q":"Үйсіндер қай мемлекетпен кең ауқымды дипломатиялық және туыстық байланыстар орнатты?","o":["Қытай","Византия","Үндістан","Парфия","Хорезм"]},{"n":21,"q":"Ежелгі қытай деректеріне сәйкес үйсіндердің астанасы қалай аталды?","o":["Чигу","Тарбан","Битянь","Көкмардан","Сығанақ"]},{"n":22,"q":"Қазақстанның далалық аймақтарын мекендеген сақ тайпаларының негізгі кәсібі қандай болды?","o":["Көшпелі және жартылай көшпелі мал шаруашылығы","Жартылай көшпелі мал шаруашылығы және қарқынды суармалы егіншілік","Жібек жолындағы сауда-делдалдық қызмет","Көшпелі мал шаруашылығы және жылтыратылған қыш бұйымдарын жасау","Жартылай көшпелі мал шаруашылығы және өзен кәсіпшілігі"]},{"n":23,"q":"Б.з.б. VII–IV ғасырларда сақ тайпаларының өнерінде кең тараған көркемдік стиль қалай аталды?","o":["Аң стилі","Полихромдық стиль","Геометриялық өрнек","Инкрустация","Антропоморфтық стиль"]},{"n":24,"q":"Қазақстандағы ерте темір дәуірі мен көшпелілер тарихын жан-жақты зерттеуге қандай дереккөздер көмектеседі?","o":["Археологиялық олжалар және ежелгі грек, парсы, қытай авторларының жазба мәліметтері","Тек көне түркі руникалық жазба ескерткіштері","Қазақ руларының шежірелері","Этнографиялық экспедиция материалдары","Көшпелілердің әдет-ғұрып құқығы ескерткіштері"]},{"n":25,"q":"Адамдар мал өсіріп, егін егу арқылы қажетті өнімдерді өздері өндіретін шаруашылық түрі қалай аталады?","o":["Өндіруші шаруашылық","Иемденуші шаруашылық","Натуралды-тұтынушылық шаруашылық","Тауар-ақша шаруашылығы","Иемденуші-терімшілік шаруашылық"]},{"n":26,"q":"Антропогенез барысында ежелгі адамдар үшін тілдің негізгі әлеуметтік қызметі қандай болды?","o":["Қарым-қатынас жасауға, бірлескен еңбекті ұйымдастыруға және тәжірибені ұрпақтан ұрпаққа жеткізуге мүмкіндік берді","Тек діни және сиқыршылық рәсімдер үшін қызмет етті","Қауым ішіндегі мүліктік жіктелудің белгісі ретінде қолданылды","Адамдардың жекелеген топтарының бір-бірінен оқшаулануына ықпал етті","Ұжымдық аңшылықтың дамуына әсер етпеді"]},{"n":27,"q":"Қола және темір дәуірлеріндегі ежелгі тайпалардың рухани мәдениеті мен дүниетанымының жоғары деңгейде дамығанын көрсететін басты дәлел не?","o":["Жерлеу ғұрыптары, жартас суреттері (петроглифтер) және ғұрыптық заттар","Табындағы қолға үйретілген жануар түрлерінің саны","Уақытша қыстаулардың көлемі мен бекініс деңгейі","Өндірілген мыс пен қалайы кенінің көлемі","Бір рулық одақ аумағындағы халық тығыздығы"]},{"n":28,"q":"Шығыс ирандық тайпалардың түркіленуінің басталуы Қазақстан аумағына кімдердің келуімен байланысты?","o":["Ғұндардың","Сақтардың","Түркілердің","Үйсіндердің","Дунхулардың"]},{"n":29,"q":"Сақтар қай елдерге жасаған жорықтары кезінде «аң стилі» дәстүрімен танысты?","o":["Алдыңғы Азия мен Иранға","Үндістанға","Қытай мен Үндістанға","Алдыңғы Азия мен Үндістанға","Парфия мен Бактрияға"]},{"n":30,"q":"Қазіргі адам түрі (Homo sapiens) қай кезеңде қалыптасты?","o":["Кейінгі палеолитте","Орта палеолитте","Мустье кезеңінде","Ерте палеолитте","Мезолитте"]},{"n":31,"q":"Ержүрек әрі дана Томирис патшайым туралы қай ежелгі грек тарихшысының еңбегінде айтылады?","o":["Книдтік Ктесий","Аммиан Марцеллин","Арриан","Квинт Курций","Полибий"]},{"n":32,"q":"Қола дәуірінде мүліктік теңсіздіктің пайда болуына қандай әлеуметтік-экономикалық үдеріс ықпал етті?","o":["Артық өнімнің пайда болуы, жұп отбасылардың бөлініп шығуы және жеке меншіктің қалыптаса бастауы","Ортақ меншік сақталған жағдайда матриархаттан патриархатқа өту және жеке меншіктің қалыптаса бастауы","Егіншіліктен толық бас тартып, аңшылық пен терімшілікке көшу","Андрон мәдениеті тайпаларының оңтүстікке қоныс аударуы және жеке меншіктің қалыптаса бастауы","Артық өнімнің пайда болуы және алғашқы көшпелі тайпалық одақтардың қалыптасуы"]},{"n":33,"q":"Қазақстандағы ерте көшпелілер өмірінде мал шаруашылығы қандай рөл атқарды?","o":["Азық-түлікпен, киім мен баспанаға қажетті шикізатпен, көлікпен және күш көлігімен қамтамасыз етті","Тек саудаға арналған жүн алу көзі болды","Азық-түлікпен қамтамасыз етіп, кетпенді егіншілік басым болған жағдайда қосалқы кәсіп қызметін атқарды","Көшпелілер оны тек ұзақ әскери жорықтар кезінде пайдаланды","Киім мен баспанаға қажетті шикізат беріп, қолөнер бұйымдарының ішкі айырбасын алмастырды"]},{"n":34,"q":"Даладағы атқа міну мәдениеті мен әскери істің дамуына жылқы шаруашылығындағы қандай жетістік түбегейлі әсер етті?","o":["Ауыздық пен сулықты, кейінірек ер-тоқым мен үзеңгіні ойлап тауып, қолданысқа енгізу","Өгіз жегілген арбаны пайдалану","Жылқыны тек ет алу мақсатында қолға үйр "q":"И.К. Кириловтың 1734 жылғы жобасының маңызды бағыты қандай болды?","o":["Орынбор экспедициясын ұйымдастыру және Ресейдің аймақтағы саяси-экономикалық ықпалын күшейту","Қазақ хандығының тәуелсіздігін халықаралық деңгейде бекіту","Жоңғарияны қазақтарға толық беру","Ресей әскерлерін қазақ даласынан шығару","Қазақтардың көшіп-қонуына шектеулерді толық жою"]},{"n":257,"q":"Орынбор экспедициясының құрылуы Ресей империясына қандай мүмкіндік берді?","o":["Қазақ даласы мен Орта Азияға бағытталған саяси, әскери және сауда ықпалын кеңейту","Қазақ хандығының билігін қалпына келтіру","Ресейдің аймақтағы саясатын тоқтату","Қазақ жерлерін жоңғарларға беру","Барлық шекаралық бекіністерді жою"]},{"n":258,"q":"И.И. Неплюевтің Орынбор өлкесіндегі саясатының басты ерекшелігі қандай болды?","o":["Шекаралық басқаруды күшейтіп, Ресей империясының қазақ даласындағы ықпалын кеңейту","Қазақ хандығына толық саяси дербестік беру","Орынбор бекінісін тарату","Қазақтардың Ресеймен сауда жасауына тыйым салу","Ресейдің отарлық саясатын тоқтату"]},{"n":259,"q":"Ресейдің шекаралық бекіністер салуы қазақ қоғамына қалай әсер етті?","o":["Көшіп-қону жолдары мен жайылымдарды пайдалануға шектеулер күшейді","Қазақтардың барлық жері қайтарылды","Дәстүрлі көшпелі шаруашылық өзгеріссіз қалды","Қазақ даласында Ресей билігі жойылды","Жоңғар шапқыншылығы біржола тоқтады"]},{"n":260,"q":"Абылай сұлтанның Жоңғариямен қарым-қатынасының негізгі мақсаты қандай болды?","o":["Қазақ жерлерін қорғау, әскери қауіп-қатерді азайту және ел мүддесін сақтау","Қазақ жерін Жоңғар хандығына қосу","Қазақ әскерін тарату","Ресеймен барлық байланысты үзу","Қытайға қарсы соғысты міндетті түрде бастау"]},{"n":261,"q":"Абылайдың Қытаймен қарым-қатынасындағы басты ұстанымы қандай болды?","o":["Шығыс шекарадағы қауіпсіздікті сақтау, жайылым мәселесін шешу және сауданы дамыту","Қазақ жерлерін Қытайға толығымен беру","Қытаймен барлық дипломатиялық байланысты үзу","Қазақ әскерін Қытайдың тұрақты әскери құрамына қосу","Ресейге қарсы Қытаймен міндетті әскери келісім жасау"]},{"n":262,"q":"Мырза Құтлы Мұхаммед Тевкелев басқарған Ресей елшілігі қазақ даласына қай жылы келді?","o":["1731 жылы","1723 жылы","1740 жылы","1755 жылы","1765 жылы"]},{"n":263,"q":"Тевкелев елшілігінің қызметі Ресей империясының қандай саяси мақсатына сәйкес келді?","o":["Қазақ даласындағы саяси ықпалын күшейтіп, аймаққа орнығу","Қазақ хандығының сыртқы саясатын толық тәуелсіз ету","Орынбор шекаралық желісін жою","Ресейдің Орта Азиямен байланысын тоқтату","Қазақ жерлеріндегі әскери бекіністерді тарату"]},{"n":264,"q":"Тевкелев елшілігінің келіссөздері кезінде қандай жағдай байқалды?","o":["Әбілқайыр ханның жақтастары мен қарсыластары арасында Ресеймен қатынас жөнінде пікір қайшылықтары болды","Қазақ қоғамы Ресей бодандығын ешбір талқылаусыз бірауыздан қабылдады","Барлық қазақ жүздері бір мезгілде Ресейге толық қосылды","Қазақ билеушілері елшілікті бірден әскери шабуылмен қарсы алды","Келіссөздер тек сауда бағаларын белгілеумен шектелді"]},{"n":265,"q":"Иван Кириловтың Орынбор экспедициясы қай жылы ұйымдастырыла бастады?","o":["1734 жылы","1726 жылы","1748 жылы","1756 жылы","1771 жылы"]},{"n":266,"q":"Орынбор экспедициясының негізгі міндеттерінің бірі қандай болды?","o":["Ресейдің қазақ даласы мен Орта Азиядағы саяси, әскери және сауда ықпалын кеңейту","Қазақ хандығының ішкі басқару жүйесін толық қалпына келтіру","Ресейдің шекаралық бекіністерін түгел жою","Қазақтардың көшіп-қонуына қойылған шектеулерді толық алып тастау","Жоңғар хандығын қазақ билігіне беру"]},{"n":267,"q":"Абылай сұлтан дипломатиясының басты ерекшелігі қандай болды?","o":["Көрші державалармен қатынаста қазақ елінің қауіпсіздігі мен саяси дербестігін сақтауға ұмтылуы","Барлық сыртқы саясатты бір мемлекетке толық тапсыруы","Қытаймен және Ресеймен байланысты біржола үзуі","Қазақ жерлерін көрші мемлекеттерге бөліп беруі","Дипломатиядан толық бас тартып, тек соғысқа сүйенуі"]},{"n":268,"q":"XIX ғасырдың басында Кіші жүзде қазақ даласындағы патшалық саясатқа қарсылық білдіргендерді басқарғандар:","o":["Қаратай сұлтан","Жантөре сұлтан","Айшуақ сұлтан","Кенесары сұлтан","Ширғазы сұлтан"]},{"n":269,"q":"Кенесарының қандай әрекеттері көтерілістің сипатын өзгертті?","o":["Қырғыз жерлеріне басып кіру","Жетісуға қоныс аудару","Сауда байланыстарына зиян келтіру","Қоқан ханымен қақтығыс","Жаппастың Шаруа руының көтерілісін басу"]},{"n":270,"q":"Кенесары Қасымов Қоқан хандығына қарсы әскери жорықты қашан бастады?","o":["1841 ж. тамыз","1837ж қыркүйек","1839 ж. наурыз","1841 ж. қыркүйек","1842 ж. наурыз"]},{"n":271,"q":"Бөкей Ордасындағы 1836-1837 жылдардағы көтерілісті кім басқарды?","o":["Исатай Тайманов","Жанқожа Нұрмұхамедов","Кенесары Қасымов.","Сырым Датов","Саржан Қасымов"]},{"n":272,"q":"1822 жылғы «Сібір қырғыздары туралы жарғының» негізгі мақсаты қандай болды?","o":["Орта жүздегі хан билігін жойып, Ресей империясының әкімшілік басқару жүйесін енгізу","Орта жүздің саяси тәуелсіздігін қалпына келтіру","Қазақ хандығын қайта құру","Қазақ жерін Бұхара әмірлігіне қосу","Ресейдің Қазақстандағы әскери қатысуын тоқтату"]},{"n":273,"q":"1824 жылғы реформа нәтижесінде Кіші жүзде қандай өзгеріс болды?","o":["Хан билігі жойылып, Кіші жүз аумағын басқару жаңа әкімшілік тәртіпке көшірілді","Хан билігі барлық қазақ жерінде қалпына келтірілді","Кіші жүз Ресейден тәуелсіз болды","Кіші жүз Қоқан хандығына қосылды","Қазақ жерінде республикалық басқару енгізілді"]},{"n":274,"q":"Ресей империясының қазақ даласында хан билігін жоюының басты мақсаты қандай болды?","o":["Дәстүрлі саяси билікті әлсіретіп, қазақ жерін тікелей империялық басқаруға бағындыру","Қазақ хандығының тәуелсіздігін нығайту","Қазақтардың өзін-өзі басқару құқығын толық кеңейту","Қазақ жеріндегі барлық салықты жою","Қазақ даласын Орта Азия хандықтарына беру"]},{"n":275,"q":"В. Перовскийдің Қоқан хандығына қарсы 1853 жылғы жорығының негізгі мақсаты қандай болды?","o":["Ақмешіт бекінісін басып алып, Ресей империясының Сырдария бойындағы ықпалын күшейту","Қоқан хандығына толық тәуелсіздік беру","Қазақ хандығын қайта қалпына келтіру","Хиуа хандығымен әскери одақ құру","Ресей әскерін Орта Азиядан шығару"]},{"n":276,"q":"1853 жылғы Ресей әскерінің жорығы кезінде алынған негізгі бекініс қайсы?","o":["Ақмешіт бекінісі","Түркістан қаласы","Ташкент қаласы","Бұхара қаласы","Әндіжан қаласы"]},{"n":277,"q":"Ұзынағаш шайқасы қай жылы болды?","o":["1860 жылы","1853 жылы","1847 жылы","1864 жылы","1867 жылы"]},{"n":278,"q":"Ұзынағаш шайқасының нәтижесі қандай болды?","o":["Ресей әскері жеңіске жетіп, Жетісудағы әскери-саяси ықпалын күшейтті","Қоқан әскері Верный бекінісін басып алды","Ресей әскері Жетісудан толық шегінді","Жетісу Қытай империясының құрамына өтті","Қоқан хандығы Ресейге толық қосылды"]},{"n":279,"q":"Әулие-Ата қаласын Ресей әскері қай жылы басып алды?","o":["1864 жылы","1853 жылы","1860 жылы","1867 жылы","1873 жылы"]},{"n":280,"q":"Түркістан қаласын Ресей әскері қай жылы басып алды?","o":["1864 жылы","1853 жылы","1860 жылы","1865 жылы","1876 жылы"]},{"n":281,"q":"ХІХ мен ХХ ғасырдың басында Қазақстанда мемлекеттік білім беру қалай дамыды?","o":["Екі бағытта — діни және зайырлы","Тек зайырлы батыс моделі бойынша","Тек жабық әскери гимназиялар арқылы","Білім беру жүйесі мүлдем болған жоқ","Тек зайырлы шығыс моделі бойынша"]},{"n":282,"q":"1864 жылы М. Черняев бастаған Ресей әскері басып алған қалалардың бірі қайсы?","o":["Шымкент","Бұхара","Хиуа","Самарқан","Қашғар"]},{"n":283,"q":"1801 жылы құрылған Бөкей Ордасы негізінен қай аумақта орналасты?","o":["Еділ мен Жайық өзендерінің аралығында","Іле өзені мен Балқаш көлінің арасында","Ертіс пен Есіл өзендерінің жоғарғы ағысында","Сырдария мен Әмудария өзендерінің арасында","Алтай тауларының шығыс бөлігінде"]},{"n":284,"q":"Бөкей Ордасындағы басқару жүйесінің басты ерекшелігі қандай болды?","o":["Хан басқаруы сақталғанымен, Орда Ресей империясының саяси бақылауында болды; хан билігі империялық әкімшілікпен шектелді","Орда Ресей империясынан толық тәуелсіз болды","Орда Қоқан хандығының тікелей басқаруына берілді","Хандық билік құрылмай, аумақ тек билер кеңесімен басқарылды","Орда Қытай империясының құрамына енгізілді"]},{"n":285,"q":"1886 жылғы «Түркістан өлкесін басқару туралы ереже» негізінен қай аумақтың басқару жүйесін реттеді?","o":["Түркістан генерал-губернаторлығының аумағын","Тек Бөкей Ордасының аумағын","Тек Орта жүздің бұрынғы хандық аумағын","Тек Орынбор қаласын","Тек Ресейдің орталық губернияларын"]},{"n":286,"q":"1891 жылғы «Ақмола, Семей, Жетісу, Орал және Торғай облыстарын басқару туралы ереженің» маңызы қандай болды?","o":["Дала облыстарындағы империялық басқару тәртібін нығайтып, әкімшілік және жер қатынастарын патша өкіметінің мүддесіне сай реттеді","Қазақ жерінің тәуелсіздігін мойындады","Хан билігін барлық облыста қалпына келтірді","Қазақ даласындағы отарлық басқаруды жойды","Қазақстанды Қоқан хандығына қосты"]},{"n":287,"q":"1867-1868 жылдардағы реформалардан кейін қазақ қоғамындағы дәстүрлі басқару жүйесінде қандай өзгерістер болды?","o":["Хан билігінің орнына патшалық әкімшілік жүйе келді, билер мен сұлтандардың өкілеттіктері шектелді.","Хан билігі бұрынғымен салыстырғанда күшейтілді.","Қазақ даласындағы барлық әкімшілік лауазымдар тек билерге берілді.","Ресей әкімшілігі қазақ аумағынан толығымен алынып тасталды.","Қазақ рулары жеке тәуелсіз мемлекеттерге бөлінді."]},{"n":288,"q":"XVIII ғасырдың соңғы ширегінен XX ғасырдың басына дейінгі әкімшілік реформалардың тарихи нәтижесі қандай болды?","o":["Қазақ даласындағы дәстүрлі саяси басқару жүйесі біртіндеп өзгеріп, Ресей империясының отарлық әкімшілік жүйесі орнықты","Қазақ хандығы толық тәуелсіз мемлекетке айналды","Қазақстандағы барлық империялық басқару органдары жойылды","Қазақ жері толығымен Орта Азия хандықтарына қосылды","Қазақ даласында хандық басқару бұрынғы қалпында сақталды"]},{"n":289,"q":"1867 жылғы реформа бойынша Жетісу және Сырдария облыстары қандай әкімшілік бірліктерге бөлінді?","o":["Уездер, уездер болыстарға, болыстар ауылдарға бөлінді","Тек хандықтар мен сұлтандықтарға бөлінді","Облыстар тікелей ауылдарға бөлінді, уездер таратылды","Жүздерге, ордаларға және хандықтарға бөлінді","Тек әскери округтерге бөлінді"]},{"n":290,"q":"1867 жылғы «Жетісу және Сырдария облыстарын басқару туралы уақытша ереже» қандай әкімшілік өзгерістер енгізді?","o":["Жетісу және Сырдария облыстарын қамтитын Түркістан генерал-губернаторлығы құрылды.","Қазақ жерінде хан билігі қалпына келтірілді.","Жетісу және Сырдария тәуелсіз мемлекеттер деп жарияланды.","Барлық облыстар Орынбор генерал-губернаторлығының қарамағына біріктірілді.","Қазақ жеріндегі әскери бекіністер жойылды."]},{"n":291,"q":"Игельстромның реформасы бойынша Кіші жүздегі хан билігіне қандай өзгерістер ұсынылды?","o":["Хан билігін жойып, оның орнына империялық әкімшілік құрылымдар орнату","Хан билігін бүкіл Қазақстан бойынша кеңейту","Хан билігін мұрагерлік арқылы нығайту","Ханды Ресей императорымен теңестіру","Хан билігін Бұхара әміріне беру"]},{"n":292,"q":"Игельстром реформасындағы «бас ақсақал» лауазымының негізгі мақсаты не болды?","o":["Кіші жүздің ру иелерін үкіметке тарту және оларды патша әкімшілігіне бағындыру","Орыс әскерлерін қазақ ақсақалдарына толығымен беру","Қазақ хандығының сыртқы саясатын дербес жүргізу","Қазақ жеріндегі барлық салықтарды алып тастау","Қазақтарды Қытайға қоныстандыруды ұйымдастыру"]},{"n":293,"q":"Игельстром реформасының толық жүзеге асырылмауына қандай жағдай әсер етті?","o":["Сырым Датула бастаған қозғалыстың күшеюі, сұлтандардың қарсылығы және хан билігін жою жобасына қолдау көрсетілмеуі","Ресей империясының Қазақстаннан толықтай кетуі","Жетісудағы Қоқан хандығының таратылуы","Бөкей ордасының дереу тәуелсіз мемлекетке айналуы","Орта жүзде хан билігінің қалпына келуі"]},{"n":294,"q":"1824 жылғы Кіші жүз реформасының авторы","o":["П.Эссен","О. Игельстром","Н. Коншин","М. Сперанский","И. Кирилов"]},{"n":295,"q":"Ресейдің отаршылдық саясаты 1750 жылдан 1770 жылға дейін Кіші жүзде қалай көрініс тапты?","o":["Жаик өзенінің маңында мал жаюға тыйым салу","Сібір казак ә const L=['A','B','C','D','E'];
const cd=q=>q.c?`<pre class="code">${esc(q.c)}</pre>`:'';
const $=document.getElementById('app');
let S={shuffle:true,ans:true};
const st={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rng=b=>Q.slice(b*50,b*50+50);
function home(){
 let h='<h1>📜 Қазақстан тарихы</h1><div class="mu">500 сұрақ · 10 блоков по 50 · Выберите блок для заучивания</div><div class="grid">';
 for(let b=0;b<10;b++){const best=st.get('kbest'+b);const p=best?Math.round(best):0;
  h+=`<button class="card" onclick="blk(${b})"><b>${b*50+1}–${b*50+50}</b><span class="mu">${best==null?'Ещё не проходили':'Лучший результат: '+p+'%'}</span><div class="bar"><i style="width:${p}%"></i></div></button>`}
 h+=`<button class="card" style="grid-column:1/-1;border-color:var(--pr)" onclick="fast2()"><b>⚡ Быстро выучить 251–500</b><span class="mu">Шпаргалка по темам + карточки + тест на 250 вопросов</span></button><button class="card" style="grid-column:1/-1;border-color:var(--pr)" onclick="fast()"><b>⚡ Быстро выучить 1–250</b><span class="mu">Шпаргалка по темам + карточки + тест на 250 вопросов</span></button>`;$.innerHTML=h+'</div>';window.scrollTo(0,0)}
function blk(b){
 $.innerHTML=`<div class="top"><button class="btn s" onclick="home()">← Назад</button></div><h2 style="margin-top:16px">Вопросы ${b*50+1}–${b*50+50}</h2>
 <div class="grid"><button class="card" onclick="study(${b})"><b>📖 Учить</b><span class="mu">Все вопросы списком, правильный ответ подсвечен</span></button>
 <button class="card" onclick="quiz(${b})"><b>🎯 Тест</b><span class="mu">По одному вопросу, с проверкой и результатом</span></button></div>
 <div class="row"><label><input type="checkbox" ${S.shuffle?'checked':''} onchange="S.shuffle=this.checked"> Перемешивать порядок вопросов и вариантов в тесте</label></div>`;window.scrollTo(0,0)}
function study(b){
 let h=`<div class="top"><button class="btn s" onclick="blk(${b})">← Назад</button><label><input type="checkbox" ${S.ans?'checked':''} onchange="S.ans=this.checked;study(${b})"> Показывать ответы</label></div><h2 style="margin-top:16px">Учить ${b*50+1}–${b*50+50}</h2>`;
 rng(b).forEach(q=>{h+=`<div class="q"><p>${q.n}. ${esc(q.q)}</p>${cd(q)}`;
  q.o.forEach((o,i)=>{h+=`<div class="o ${S.ans&&i==0?'ok':''}" ${S.ans?'':'onclick="this.classList.add(\''+(i==0?'ok':'no')+'\')"'}><span>${L[i]})</span><span>${esc(o)}</span></div>`});h+='</div>'});
 $.innerHTML=h+`<button class="btn" onclick="quiz(${b})">Пройти тест →</button>`;window.scrollTo(0,0)}
let G;
function quiz(b,list){
 let items=(list||rng(b)).map(q=>{let idx=[0,1,2,3,4];if(S.shuffle)idx=sh(idx);return{q,idx}});
 if(S.shuffle)items=sh(items);

function ask(){

 it.idx.forEach((k,pos)=>{h+=`<button class="o" onclick="pick(${pos})"><span>${L[pos]})</span><span>${esc(it.q.o[k])}</span></button>`});

function pick(pos){
 if(G.done)return;G.done=true;const it=G.items[G.i];const bs=document.querySelectorAll('.o');

 const last=G.i==G.items.length-1;

function nxt(){G.done=false;G.i++;G.i<G.items.length?ask():fin()}
function fin(){
 const p=Math.round(G.ok/G.total*100);
 if(G.total==50&&!G.home){const o=st.get('kbest'+G.b);if(o==null||p>o)st.set('kbest'+G.b,p)}

const CH2=[{"t":["Заңдар, жоңғар соғыстары, Ресеймен қарым-қатынас (251–260)","Законы, джунгарские войны, отношения с Россией (251–260)"],"i":[["Жоңғарлардың қазақ жеріне шапқыншылық жасауының негізгі мақсаттарының бірі қандай болды — Жайылымдық жерлерді, стратегиялық аумақтарды және сауда жолдарына ықпал ететін өңірлерді бақылауға алу"],["«Ақтабан шұбырынды, Алқакөл сұлама» оқиғалары қай жылдары болды — 1723–1727 жылдары"],["Қойбағар Қобаяковтың дипломатиялық миссиясының негізгі мақсаты қандай болды — Қазақ-орыс саяси байланыстарын дамыту және Әбілқайыр ханның саясатын жеткізу"],["Әбілқайыр ханның Ресейге жіберген елшілігін кімдер басқарды — Сейітқұл Қойдағұлов пен Құтлымбет Қоштаев"],["Әбілқайыр хан елшілігінің 1730–1731 жылдардағы негізгі мақсаты қандай еді — Ресей империясының қолдауына ие болу және Кіші жүздің қауіпсіздігін қамтамасыз ету"],["И.К. Кириловтың 1734 жылғы жобасының маңызды бағыты қандай болды — Орынбор экспедициясын ұйымдастыру және Ресейдің аймақтағы саяси-экономикалық ықпалын күшейту"],["Орынбор экспедициясының құрылуы Ресей империясына қандай мүмкіндік берді — Қазақ даласы мен Орта Азияға бағытталған саяси, әскери және сауда ықпалын кеңейту"],["И.И. Неплюевтің Орынбор өлкесіндегі саясатының басты ерекшелігі қандай болды — Шекаралық басқаруды күшейтіп, Ресей империясының қазақ даласындағы ықпалын кеңейту"],["Ресейдің шекаралық бекіністер салуы қазақ қоғамына қалай әсер етті — Көшіп-қону жолдары мен жайылымдарды пайдалануға шектеулер күшейді"],["Абылай сұлтанның Жоңғариямен қарым-қатынасының негізгі мақсаты қандай болды — Қазақ жерлерін қорғау, әскери қауіп-қатерді азайту және ел мүддесін сақтау"]]},{"t":["Абылай хан, Орынбор экспедициясы, Қоқан (261–280)","Абылай хан, Оренбургская экспедиция, Коканд (261–280)"],"i":[["Абылайдың Қытаймен қарым-қатынасындағы басты ұстанымы қандай болды — Шығыс шекарадағы қауіпсіздікті сақтау, жайылым мәселесін шешу және сауданы дамыту"],["Мырза Құтлы Мұхаммед Тевкелев басқарған Ресей елшілігі қазақ даласына қай жылы келді — 1731 жылы"],["Тевкелев елшілігінің қызметі Ресей империясының қандай саяси мақсатына сәйкес келді — Қазақ даласындағы саяси ықпалын күшейтіп, аймаққа орнығу"],["Тевкелев елшілігінің келіссөздері кезінде қандай жағдай байқалды — Әбілқайыр ханның жақтастары мен қарсыластары арасында Ресеймен қатынас жөнінде пікір қайшылықтары болды"],["Иван Кириловтың Орынбор экспедициясы қай жылы ұйымдастырыла бастады — 1734 жылы"],["Орынбор экспедициясының негізгі міндеттерінің бірі қандай болды — Ресейдің қазақ даласы мен Орта Азиядағы саяси, әскери және сауда ықпалын кеңейту"],["Абылай сұлтан дипломатиясының басты ерекшелігі қандай болды — Көрші державалармен қатынаста қазақ елінің қауіпсіздігі мен саяси дербестігін сақтауға ұмтылуы"],["XIX ғасырдың басында Кіші жүзде қазақ даласындағы патшалық саясатқа қарсылық білдіргендерді басқарғандар — Қаратай сұлтан"],["Кенесарының қандай әрекеттері көтерілістің сипатын өзгертті — Қырғыз жерлеріне басып кіру"],["Кенесары Қасымов Қоқан хандығына қарсы әскери жорықты қашан бастады — 1841 ж. тамыз"],["Бөкей Ордасындағы 1836-1837 жылдардағы көтерілісті кім басқарды — Исатай Тайманов"],["1822 жылғы «Сібір қырғыздары туралы жарғының» негізгі мақсаты қандай болды — Орта жүздегі хан билігін жойып, Ресей империясының әкімшілік басқару жүйесін енгізу"],["1824 жылғы реформа нәтижесінде Кіші жүзде қандай өзгеріс болды — Хан билігі жойылып, Кіші жүз аумағын басқару жаңа әкімшілік тәртіпке көшірілді"],["Ресей империясының қазақ даласында хан билігін жоюының басты мақсаты қандай болды — Дәстүрлі саяси билікті әлсіретіп, қазақ жерін тікелей империялық басқаруға бағындыру"],["В. Перовскийдің Қоқан хандығына қарсы 1853 жылғы жорығының негізгі мақсаты қандай болды — Ақмешіт бекінісін басып алып, Ресей империясының Сырдария бойындағы ықпалын күшейту"],["1853 жылғы Ресей әскерінің жорығы кезінде алынған негізгі бекініс қайсы — Ақмешіт бекінісі"],["Ұзынағаш шайқасы қай жылы болды — 1860 жылы"],["Ұзынағаш шайқасының нәтижесі қандай болды — Ресей әскері жеңіске жетіп, Жетісудағы әскери-саяси ықпалын күшейтті"],["Әулие-Ата қаласын Ресей әскері қай жылы басып алды — 1864 жылы"],["Түркістан қаласын Ресей әскері қай жылы басып алды — 1864 жылы"]]},{"t":["XIX ғ.: реформалар және Ресейдің отарлауы (281–300)","XIX в.: реформы и колонизация Россией (281–300)"],"i":[["ХІХ мен ХХ ғасырдың басында Қазақстанда мемлекеттік білім беру қалай дамыды — Екі бағытта — діни және зайырлы"],["1864 жылы М. Черняев бастаған Ресей әскері басып алған қалалардың бірі қайсы — Шымкент"],["1801 жылы құрылған Бөкей Ордасы негізінен қай аумақта орналасты — Еділ мен Жайық өзендерінің аралығында"],["Бөкей Ордасындағы басқару жүйесінің басты ерекшелігі қандай болды — Хан басқаруы сақталғанымен, Орда Ресей империясының саяси бақылауында болды; хан билігі империялық әкімшілікпен шектелді"],["1886 жылғы «Түркістан өлкесін басқару туралы ереже» негізінен қай аумақтың басқару жүйесін реттеді — Түркістан генерал-губернаторлығының аумағын"],["1891 жылғы «Ақмола, Семей, Жетісу, Орал және Торғай облыстарын басқару туралы ереженің» маңызы қандай болды — Дала облыстарындағы империялық басқару тәртібін нығайтып, әкімшілік және жер қатынастарын патша өкіметінің мүддесіне сай реттеді"],["1867-1868 жылдардағы реформалардан кейін қазақ қоғамындағы дәстүрлі басқару жүйесінде қандай өзгерістер болды — Хан билігінің орнына патшалық әкімшілік жүйе келді, билер мен сұлтандардың өкілеттіктері шектелді."],["XVIII ғасырдың соңғы ширегінен XX ғасырдың басына дейінгі әкімшілік реформалардың тарихи нәтижесі қандай болды — Қазақ даласындағы дәстүрлі саяси басқару жүйесі біртіндеп өзгеріп, Ресей империясының отарлық әкімшілік жүйесі орнықты"],["1867 жылғы реформа бойынша Жетісу және Сырдария облыстары қандай әкімшілік бірліктерге бөлінді — Уездер, уездер болыстарға, болыстар ауылдарға бөлінді"],["1867 жылғы «Жетісу және Сырдария облыстарын басқару туралы уақытша ереже» қандай әкімшілік өзгерістер енгізді — Жетісу және Сырдария облыстарын қамтитын Түркістан генерал-губернаторлы
